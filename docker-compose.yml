version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# hydromet_bulletin — docker-compose.yml
#
# On-demand бюллетень:
#   docker-compose run --rm bulletin
#   FORECAST_DATE=2026-06-08 FORECAST_TIME=14:00 \
#     docker-compose run --rm bulletin
#
# Фоновый cron (предзагрузка GFS данных):
#   docker-compose up -d
#
# Логи cron ingest:
#   docker-compose logs -f
# ─────────────────────────────────────────────────────────────────────────────

services:
  bulletin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hydromet_bulletin
    restart: "no"    # on-demand: не перезапускать автоматически

    volumes:
      # GFS и CMEMS данные
      - ./data/storage:/app/data/storage
      - ./Kasp_Sea.shp:/app/Kasp_Sea.shp:ro
      - ./Kasp_Sea.dbf:/app/Kasp_Sea.dbf:ro
      - ./Kasp_Sea.prj:/app/Kasp_Sea.prj:ro
      - ./Kasp_Sea.shx:/app/Kasp_Sea.shx:ro
      - ./Kasp_Sea.cpg:/app/Kasp_Sea.cpg:ro

      # Конфиг
      - ./config.ini:/app/config.ini

      # Выходные .docx бюллетени
      - ./output:/app/output

      # Логи
      - ./logs:/app/logs

      # Ingest events JSONL
      - ./ingest_events:/app/ingest_events

      # Manifest
      - ./storage:/app/storage

    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - HYDROMET_INGEST_EVENTS_PATH=/app/ingest_events/ingest_events.jsonl
      - FORECAST_DATE=${FORECAST_DATE:-}
      - FORECAST_TIME=${FORECAST_TIME:-}
      - FORECAST_TZ=${FORECAST_TZ:-MSK}

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Отдельный сервис для фонового cron ingest
  ingest-cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hydromet_ingest_cron
    restart: unless-stopped
    command: ["cron"]

    volumes:
      - ./data/storage:/app/data/storage
      - ./config.ini:/app/config.ini
      - ./logs:/app/logs
      - ./ingest_events:/app/ingest_events
      - ./storage:/app/storage

    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - HYDROMET_INGEST_EVENTS_PATH=/app/ingest_events/ingest_events.jsonl

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
