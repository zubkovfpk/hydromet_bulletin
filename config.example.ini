# config.example.ini
[SMTP]
host = smtp.example.com
port = 465
username = your_email@example.com
password = CHANGE_ME
from_email = your_email@example.com
to_email = recipient@example.com

[PATHS]
output_dir = output
logs_dir = logs
data_dir = data

[APP]
timezone = Europe/Moscow

[SOURCES]
cmems_base_url = https://data.marine.copernicus.eu
cmems_product_path = /product/GLOBAL_ANALYSISFORECAST_WAV_001_027/files
cmems_dataset_id = cmems_mod_glo_wav_anfc_0.083deg_PT3H-i
cmems_subdataset_template = cmems_mod_glo_wav_anfc_0.083deg_PT3H-i_{yyyymm}
cmems_dynamic_path_mask = /{yyyy}/{mm}/

[AUTH]
cmems_auth_method = token
cmems_username = your_username_here
cmems_password = CHANGE_ME
cmems_token = CHANGE_ME
cmems_client_id = CHANGE_ME
cmems_client_secret = CHANGE_ME
auth_retry_enabled = true
auth_error_notify = true

[DOWNLOAD]
download_schedule_cron = 30 0 * * *
download_frequency_per_day = 1
download_retry_count = 3
download_timeout_seconds = 600
replace_same_name_files = true

[FORECAST]
forecast_days = 5
files_per_cycle = 10
run_window_1_start = 00:30
run_window_1_end = 12:30
run_window_2_start = 12:31
run_window_2_end = 00:29
file_name_patterns = mfwamglocep_*_R*_00H.nc,mfwamglocep_*_R*_12H.nc

[VALIDATION]
reference_schema_path = schemas/waves_reference_schema.json
required_variables = hs,tp,dp
target_bbox = 19.0,40.0,47.0,56.0
validate_file_date = true
crop_enabled = true

[STORAGE]
work_dir = data/work
storage_dir = data/storage

[LOGGING]
log_level = INFO
alert_channel = email

[GFS_SOURCES]
GFS_BASE_URL = https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25_1hr.pl
GFS_MODEL_PATH_TEMPLATE = gfs.{yyyymmdd}/{cycle}
GFS_CYCLES = 00z,06z,12z,18z
GFS_UPDATE_FREQUENCY_PER_DAY = 4

[GFS_AUTH]
GFS_USERNAME = CHANGE_ME
GFS_PASSWORD = CHANGE_ME
GFS_TOKEN = CHANGE_ME

[GFS_DOWNLOAD]
GFS_DOWNLOAD_FREQUENCY_PER_DAY = 2
GFS_DOWNLOAD_SCHEDULE_CRON = 0 5,17 * * *
GFS_TIMEOUT_SECONDS = 600
GFS_MAX_RETRIES = 3
GFS_HTTP_RETRY_DELAY_SECONDS = 30

[GFS_FORECAST]
GFS_FORECAST_HOURS_START = 0
GFS_FORECAST_HOURS_END = 72
GFS_FORECAST_HOURS_STEP = 1
GFS_VARIABLES = TMP,UGRD,VGRD,PRMSL
GFS_LEVELS = 2_m_above_ground,mean_sea_level

[GFS_VALIDATION]
GFS_REQUIRED_FORMATS = grb2,nc
GFS_ENABLE_CONVERSION_TO_NETCDF = true
GFS_CHECK_FORECAST_COMPLETENESS = true
GFS_MIN_EXPECTED_FILES = 1

[GFS_STORAGE]
GFS_WORK_DIR = data/work/gfs
GFS_OUTPUT_DIR = data/output/gfs

[GFS_LOGGING]
GFS_LOG_LEVEL = INFO
GFS_ALERT_CHANNEL = email
