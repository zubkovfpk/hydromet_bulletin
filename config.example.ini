# config.example.ini
# Скопируй в config.ini и заполни реальными значениями вместо CHANGE_ME

[General]
target_date =
output_dir  = /app/output
basedir     = /app


[BoundingBox]
leftlon    = 46
rightlon   = 55
toplat     = 48
bottomlat  = 42


[Email]
smtp_host  = smtp.example.com
smtp_port  = 465
login      = your_email@example.com
password   = CHANGE_ME
recipient  = recipient@example.com


[DOWNLOAD]
download_schedule_cron        = 30 0 * * *
download_frequency_per_day    = 1
download_retry_count          = 3
download_timeout_seconds      = 600
replace_same_name_files       = true
download_retry_delay_seconds  = 30


[STORAGE]
work_dir    = data/work
storage_dir = data/storage


[LOGGING]
log_level     = INFO
alert_channel = email


; -------------------------------------------------------
; CMEMS (волнение)
; -------------------------------------------------------

[CMEMS_SOURCES]
cmems_base_url             = https://data.marine.copernicus.eu
cmems_product_path         = /product/GLOBAL_ANALYSISFORECAST_WAV_001_027/files
cmems_dataset_id           = cmems_mod_glo_wav_anfc_0.083deg_PT3H-i
cmems_subdataset_template  = cmems_mod_glo_wav_anfc_0.083deg_PT3H-i_{yyyymm}
cmems_dynamic_path_mask    = /{yyyy}/{mm}/
cmems_auth_method          = token
cmems_username             = CHANGE_ME
cmems_password             = CHANGE_ME
cmems_token                = CHANGE_ME


[CMEMS_FORECAST]
forecast_days        = 5
files_per_cycle      = 10
run_window_1_start   = 00:30
run_window_1_end     = 12:30
run_window_2_start   = 12:31
run_window_2_end     = 00:29
file_name_patterns   = mfwamglocep_*_R*_00H.nc,mfwamglocep_*_R*_12H.nc


[CMEMS_VALIDATION]
reference_schema_path = schemas/waves_reference_schema.json
required_variables    = hs,tp,dp
target_bbox           = 19.0,40.0,47.0,56.0
validate_file_date    = true
crop_enabled          = true


; -------------------------------------------------------
; GFS (метео)
; -------------------------------------------------------

[GFS_SOURCES]
GFS_MAIN_URL                 = https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25_1hr.pl
GFS_MODEL_PATH_TEMPLATE      = gfs.{yyyymmdd}/{cycle}/atmos
GFS_CYCLES                   = 00z,06z,12z,18z
GFS_UPDATE_FREQUENCY_PER_DAY = 4


[GFS_DOWNLOAD]
GFS_DOWNLOAD_FREQUENCY_PER_DAY = 2
GFS_DOWNLOAD_SCHEDULE_CRON     = 0 5,17 * * *
GFS_TIMEOUT_SECONDS            = 600
GFS_MAX_RETRIES                = 3
GFS_HTTP_RETRY_DELAY_SECONDS   = 30


[GFS_FORECAST]
# 40 шагов × 3ч: f006, f009, ..., f123
GFS_FORECAST_HOURS_START = 6
GFS_FORECAST_HOURS_END   = 123
GFS_FORECAST_HOURS_STEP  = 3
GFS_LEVELS    = lev_10_m_above_ground=on&lev_surface=on
GFS_VARIABLES = var_CFRZR=on&var_CICEP=on&var_CRAIN=on&var_CSNOW=on&var_GUST=on&var_TMP=on&var_UGRD=on&var_VGRD=on&var_VIS=on


[GFS_VALIDATION]
GFS_REQUIRED_FORMATS             = grb2
GFS_ENABLE_CONVERSION_TO_NETCDF  = false
GFS_CHECK_FORECAST_COMPLETENESS  = true
GFS_MIN_EXPECTED_FILES           = 40


[GFS_STORAGE]
GFS_WORK_DIR   = data/work/gfs
GFS_OUTPUT_DIR = data/output/gfs


[GFS_LOGGING]
GFS_LOG_LEVEL     = INFO
GFS_ALERT_CHANNEL = email